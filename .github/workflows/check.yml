name: check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --all-groups --locked
      - name: Tests
        run: uv run pytest
      - name: Lint
        if: runner.os == 'Linux'
        run: uv run ruff check
      - name: Format
        if: runner.os == 'Linux'
        run: uv run ruff format --check
      - name: Types
        if: runner.os == 'Linux'
        run: uv run basedpyright

  publish:
    needs: check
    if: (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CLAUDE_CLI_WEEK=${{ steps.week.outputs.week }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run -d --name smoke --user 1234:100 -e FETCH_POKEMON_ASSETS=false "$IMAGE"
          trap 'docker logs smoke' ERR
          for _ in $(seq 60); do
            docker exec smoke python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/status")' && break
            sleep 1
          done
          docker exec smoke python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/status")'
          docker exec smoke claude --version
          docker exec smoke codex --version
          docker exec smoke node --version
          docker exec smoke test -d /app/vendor/showdown
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CLAUDE_CLI_WEEK=${{ steps.week.outputs.week }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          range=${previous:+$previous..}$TAG
          changes=$(git log --no-merges --format='- %s' "$range" | grep -v '^- Bump ' || true)
          bumps=$(git log --no-merges --format='- %s' "$range" | grep '^- Bump ' || true)
          {
            if [ -n "$changes" ]; then printf '## Changes\n\n%s\n\n' "$changes"; fi
            if [ -n "$bumps" ]; then printf '## Dependencies\n\n%s\n\n' "$bumps"; fi
            if [ -n "$previous" ]; then echo "**Full diff:** https://github.com/$REPO/compare/$previous...$TAG"; fi
          } > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Rulehall ${TAG#v}" --notes-file notes.md
