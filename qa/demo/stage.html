<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=EB+Garamond:wght@500;600&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root { --a: #8b6cf0; --b: #e2779b; --ease: cubic-bezier(.65,0,.35,1); --pop: cubic-bezier(.2,.9,.2,1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07070c; }
  body { font-family: Inter, system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

  /* Backdrop: two colour fields in the scene's accent, drifting. */
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #bg .blob { position: absolute; width: 1500px; height: 1500px; border-radius: 50%; filter: blur(150px);
    opacity: .46; transition: background 1s ease; }
  #bg .b1 { background: var(--a); left: -520px; top: -760px; animation: drift1 14s ease-in-out infinite alternate; }
  #bg .b2 { background: var(--b); right: -620px; bottom: -860px; animation: drift2 16s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(260px, 160px); } }
  @keyframes drift2 { to { transform: translate(-240px, -130px); } }
  #bg::after { content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size: 28px 28px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%); }

  #world { position: absolute; inset: 0; transform-origin: 0 0; transition: transform .85s var(--ease); perspective: 2200px; }
  #window { position: absolute; left: 192px; top: 34px; width: 1536px; height: 904px; border-radius: 16px;
    overflow: hidden; background: #111; transition: transform 1s var(--pop), opacity .6s ease, filter .5s ease;
    box-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 40px 100px rgba(0,0,0,.6), 0 10px 30px rgba(0,0,0,.35); }
  #window.away { transform: translateY(160px) rotateX(24deg) scale(.86); opacity: 0; }
  #window.blur { filter: blur(14px) brightness(.55); transform: scale(1.04); }
  #chrome { height: 40px; display: flex; align-items: center; padding: 0 16px; gap: 8px;
    background: linear-gradient(#24242c, #1b1b22); border-bottom: 1px solid rgba(255,255,255,.06); }
  #chrome i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  #url { position: absolute; left: 50%; transform: translateX(-50%); font: 500 13px Inter; color: rgba(255,255,255,.55);
    background: rgba(255,255,255,.06); padding: 6px 60px; border-radius: 8px; }
  #viewport { position: relative; width: 1536px; height: 864px; overflow: hidden; background: #111; }
  #app { width: 1280px; height: 720px; border: 0; transform: scale(1.2); transform-origin: 0 0; display: block; }

  /* Kinetic caption: a big claim, word by word, then the proof in a lighter voice. */
  #cap { pointer-events: none; position: absolute; left: 84px; bottom: 64px; z-index: 30; max-width: 1500px; }
  #cap .t { display: flex; flex-wrap: wrap; gap: 0 .26em; font: 900 74px/1.02 Inter; letter-spacing: -.035em;
    text-shadow: 0 6px 40px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.6); }
  #cap .t span { display: inline-block; opacity: 0; transform: translateY(46px) rotate(4deg); filter: blur(8px);
    transition: opacity .35s ease, transform .5s var(--pop), filter .4s ease; }
  #cap .t span.hot { background: linear-gradient(100deg, #ffe0a3, var(--b)); -webkit-background-clip: text; color: transparent;
    text-shadow: none; filter: drop-shadow(0 6px 30px rgba(0,0,0,.7)); }
  #cap.on .t span { opacity: 1; transform: none; filter: none; }
  #cap .s { margin-top: 14px; display: inline-block; font: 600 27px Inter; letter-spacing: -.01em; color: #fff;
    padding: 9px 18px; border-radius: 12px; background: rgba(9,9,14,.62); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(14px); opacity: 0; transform: translateY(14px); transition: opacity .4s ease .25s, transform .5s var(--pop) .25s; }
  #cap.on .s { opacity: 1; transform: none; }
  #cap.out .t span, #cap.out .s { opacity: 0; transform: translateY(-24px); filter: blur(6px); transition-delay: 0s !important; transition-duration: .22s; }

  /* Slam: a full-screen word between scenes; it also hides each page load. */
  #slam { position: absolute; inset: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(7,7,12,.55), rgba(7,7,12,.92)); transition: opacity .2s ease; }
  #slam.on { opacity: 1; }
  #slam .k { font: 800 24px Inter; letter-spacing: .34em; color: rgba(255,255,255,.7); margin-bottom: 18px;
    transform: translateY(20px); opacity: 0; transition: all .45s var(--pop) .08s; }
  #slam .w { font: 900 188px/0.92 Inter; letter-spacing: -.055em; text-align: center;
    background: linear-gradient(180deg, #fff 20%, var(--b) 120%); -webkit-background-clip: text; color: transparent;
    transform: scale(1.35); filter: blur(18px); opacity: 0; transition: transform .6s var(--pop), filter .4s ease, opacity .25s ease; }
  #slam.on .w { transform: scale(1); filter: none; opacity: 1; }
  #slam.on .k { transform: none; opacity: 1; }
  #slam .bar { width: 0; height: 8px; margin-top: 34px; border-radius: 99px; background: linear-gradient(90deg, var(--a), var(--b)); transition: width .7s var(--ease) .1s; }
  #slam.on .bar { width: 260px; }

  /* Cards: the end card. */
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; opacity: 0; pointer-events: none; transition: opacity .5s ease; z-index: 36; }
  .card.on { opacity: 1; }
  .card > * { transform: translateY(30px) scale(.98); opacity: 0; transition: transform .8s var(--pop), opacity .6s ease; }
  .card.on > * { transform: none; opacity: 1; }
  .card.on > *:nth-child(2) { transition-delay: .1s; } .card.on > *:nth-child(3) { transition-delay: .22s; }
  .card.on > *:nth-child(4) { transition-delay: .36s; } .card.on > *:nth-child(5) { transition-delay: .5s; }
  .logo { width: 116px; height: 116px; border-radius: 30px; display: grid; place-items: center; margin-bottom: 30px;
    background: linear-gradient(145deg, #ffd89b, #e08a5a); box-shadow: 0 20px 70px rgba(224,138,90,.45), inset 0 1px 0 rgba(255,255,255,.5); }
  .logo svg { width: 64px; height: 64px; }
  h1 { font: 600 132px/1 'EB Garamond', serif; letter-spacing: -.02em;
    background: linear-gradient(180deg, #fff 30%, #d9cbe9); -webkit-background-clip: text; color: transparent; }
  .tag { margin-top: 18px; font-size: 38px; font-weight: 700; letter-spacing: -.02em; color: #fff; }
  .chips { margin-top: 30px; display: flex; gap: 14px; }
  .chip { font: 700 19px Inter; letter-spacing: .02em; padding: 12px 22px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); color: rgba(255,255,255,.9); }
  .cmd { margin-top: 40px; font: 500 32px 'JetBrains Mono', monospace; padding: 22px 38px; border-radius: 16px;
    background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.16); color: #fff; }
  .cmd b { color: #ffd89b; font-weight: 500; }

  #speed { pointer-events: none; position: absolute; right: 208px; top: 50px; z-index: 40; display: flex; align-items: center; gap: 8px;
    font: 800 16px Inter; letter-spacing: .06em; color: #14101c; padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(135deg, #ffe0a3, var(--b)); box-shadow: 0 8px 30px rgba(0,0,0,.4);
    opacity: 0; transform: translateY(-8px) scale(.9); transition: opacity .2s, transform .3s var(--pop); }
  #speed.on { opacity: 1; transform: none; }
  #speed svg { width: 18px; height: 18px; }
  #file { position: absolute; left: 0; top: 0; z-index: 48; width: 176px; pointer-events: none; opacity: 0;
    transition: opacity .3s ease, scale .4s var(--pop); transform-origin: 20% 10%; }
  #file .page { height: 214px; border-radius: 10px; background: linear-gradient(#fff, #eef0f4); position: relative;
    box-shadow: 0 22px 50px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.08); padding: 18px 14px; overflow: hidden; }
  #file .page::before { content: ""; position: absolute; right: 0; top: 0; width: 30px; height: 30px;
    background: linear-gradient(225deg, #07070c 50%, #d7dae2 50%); }
  #file .page i { display: block; height: 6px; border-radius: 3px; background: #d9dce4; margin: 9px 0; }
  #file .badge { position: absolute; left: 14px; bottom: 16px; font: 800 18px Inter; color: #fff; background: #e5484d;
    padding: 5px 9px; border-radius: 6px; letter-spacing: .04em; }
  #file .name { margin-top: 12px; font: 700 18px Inter; color: #fff; text-align: center; line-height: 1.25;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 50; pointer-events: none;
    transform: translate(-200px, -200px); filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); transition: opacity .3s; }
  #ring { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; z-index: 49;
    border: 3px solid rgba(255,255,255,.95); opacity: 0; pointer-events: none; }
  #ring.go { animation: ring .5s cubic-bezier(.2,.7,.3,1); }
  @keyframes ring { 0% { opacity: .95; transform: scale(.25); } 100% { opacity: 0; transform: scale(1.4); } }
  #flash { position: absolute; inset: 0; z-index: 45; pointer-events: none; opacity: 0; background: #fff; mix-blend-mode: overlay; }
  #flash.go { animation: flash .45s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
<div id="world">
  <div id="window" class="away">
    <div id="chrome"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
      <div id="url">localhost:8080</div></div>
    <div id="viewport"><iframe id="app" name="app"></iframe></div>
  </div>
</div>
<div id="cap"></div>
<div id="slam"><div class="k"></div><div class="w"></div><div class="bar"></div></div>

<div class="card" id="end">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#2a1608" stroke-width="1.9" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="#2a1608"/>
    <circle cx="15.5" cy="15.5" r="1.3" fill="#2a1608"/><circle cx="12" cy="12" r="1.3" fill="#2a1608"/>
    <circle cx="15.5" cy="8.5" r="1.3" fill="#2a1608"/><circle cx="8.5" cy="15.5" r="1.3" fill="#2a1608"/></svg></div>
  <h1>Rulehall</h1>
  <div class="tag">Your solo tabletop night starts here.</div>
  <div class="chips"><span class="chip">Free &amp; open source</span><span class="chip">Claude · Codex · OpenRouter · local</span><span class="chip">Your own worlds</span></div>
  <div class="cmd"><b>$</b> uv sync &amp;&amp; uv run rulehall</div>
</div>

<div id="speed"><svg viewBox="0 0 24 24" fill="#14101c"><path d="M3 5l9 7-9 7zM12 5l9 7-9 7z"/></svg><span></span></div>
<div id="file"><div class="page"><i style="width:70%"></i><i></i><i style="width:85%"></i><i style="width:60%"></i><span class="badge">PDF</span></div>
  <div class="name">The Drowned<br>Lighthouse.pdf</div></div>
<div id="ring"></div>
<div id="flash"></div>
<div id="cursor"><svg viewBox="0 0 26 26" width="34" height="34" style="transform-origin: 6.5px 3.3px; display: block"><path d="M5 2.5 L5 21 L9.6 16.6 L12.8 23.6 L16 22.2 L12.9 15.4 L19.3 15.4 Z"
  fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>

<script>
  const $ = id => document.getElementById(id);
  let pos = {x: 1180, y: 700};
  let carrying = false;
  const put = () => {
    $('cursor').style.transform = `translate(${pos.x - 6}px,${pos.y - 3}px)`;
    if (carrying) $('file').style.transform = `translate(${pos.x - 40}px,${pos.y - 30}px) rotate(-6deg)`;
  };
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  let zoom = {s: 1, tx: 0, ty: 0};
  const words = text => text.split(' ').map(w => w.startsWith('*') ? `<span class="hot">${w.slice(1)}</span>` : `<span>${w}</span>`);
  window.demo = {
    move(x, y, ms) {
      return new Promise(res => {
        const from = {...pos}, t0 = performance.now(), dx = x - from.x, dy = y - from.y;
        const len = Math.hypot(dx, dy) || 1, bend = Math.min(70, len * .12);
        const step = now => {
          const k = Math.min(1, (now - t0) / ms), e = ease(k), arc = Math.sin(Math.PI * e) * bend;
          pos = {x: from.x + dx * e - dy / len * arc, y: from.y + dy * e + dx / len * arc}; put();
          k < 1 ? requestAnimationFrame(step) : res();
        };
        requestAnimationFrame(step);
      });
    },
    click() {
      const r = $('ring'); r.style.left = pos.x + 'px'; r.style.top = pos.y + 'px';
      r.classList.remove('go'); void r.offsetWidth; r.classList.add('go');
      // Pulse the arrow only; the wrapper's transform holds the position.
      $('cursor').firstElementChild.animate([{transform: 'scale(1)'}, {transform: 'scale(.8)'}, {transform: 'scale(1)'}], {duration: 240});
    },
    carry(on) {
      const f = $('file');
      if (on) { carrying = true; f.style.scale = 1; put(); f.style.opacity = 1; }
      else { carrying = false; f.style.scale = .55; f.style.opacity = 0; }
    },
    cursor(on) { $('cursor').style.opacity = on ? 1 : 0; },
    // A word that starts with `*` takes the accent gradient.
    caption(t, s) {
      const c = $('cap');
      const show = () => {
        c.className = '';
        c.innerHTML = `<div class="t">${words(t).join('')}</div>` + (s ? `<div class="s">${s}</div>` : '');
        c.querySelectorAll('.t span').forEach((w, i) => w.style.transitionDelay = `${i * 55}ms`);
        void c.offsetWidth; c.classList.add('on');
      };
      const had = c.classList.contains('on');
      if (had) c.classList.add('out');
      if (!t) return;
      had ? setTimeout(show, 230) : show();
    },
    slam(on, word, kicker) {
      const s = $('slam');
      s.classList.remove('on');
      if (!on) return;
      // Replay the entrance for each new word, even when the slam is already up.
      s.querySelector('.w').innerHTML = word; s.querySelector('.k').textContent = kicker || '';
      void s.offsetWidth; s.classList.add('on'); demo.flash();
    },
    flash() { const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); },
    theme(a, b) { document.documentElement.style.setProperty('--a', a); document.documentElement.style.setProperty('--b', b); },
    card(id, on) { $(id).classList.toggle('on', on); },
    window(state) { $('window').classList.toggle('away', state === 'away'); $('window').classList.toggle('blur', state === 'blur'); },
    speed(f) { $('speed').classList.toggle('on', f > 1); if (f > 1) $('speed').querySelector('span').textContent = `FAST-FORWARD · ${f}×`; },
    url(u) { $('url').textContent = u; },
    // A scroll into view inside the app also scrolls the stage around it; undo that.
    unscroll() { for (const e of [document.scrollingElement, $('world'), $('window'), $('viewport')]) { e.scrollTop = 0; e.scrollLeft = 0; } },
    // Zoom the world so stage point (x, y) lands at the frame centre, clamped to the frame.
    zoom(s, x, y, ms) {
      let tx = 960 - x * s, ty = 540 - y * s;
      tx = Math.min(0, Math.max(1920 - 1920 * s, tx)); ty = Math.min(0, Math.max(1080 - 1080 * s, ty));
      if (s === 1) { tx = 0; ty = 0; }
      zoom = {s, tx, ty};
      $('world').style.transitionDuration = (ms || 850) + 'ms';
      $('world').style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
      return zoom;
    },
    // Where a point of the unzoomed world shows on screen now.
    project(x, y) { return [x * zoom.s + zoom.tx, y * zoom.s + zoom.ty]; },
  };
  put();
</script>
</body>
</html>
