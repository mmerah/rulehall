[project]
name = "rulehall"
version = "0.1.0"
description = "Solo tabletop role-playing: AI roles play many rule sets, code owns the dice"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "nicegui==3.16.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "pypdf==6.16.2",
    "mcp==2.0.0",
]

[project.scripts]
rulehall = "rulehall.ui.app:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulehall"]

[dependency-groups]
dev = [
    "basedpyright==1.39.10",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.4",
]
qa = [
    "playwright==1.56.0",
]

[tool.uv]
default-groups = ["dev", "qa"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
reportUnusedCallResult = false # NiceGUI's builder API returns elements by design
reportUnannotatedClassAttribute = false # pydantic's `model_config` is unannotated

[tool.ruff]
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID252", "N", "ARG", "SIM", "RUF", "C4", "RET", "PERF", "FBT"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"qa/*" = ["FBT"] # `check(condition, message)` is the `assert` shape, not a boolean trap

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
